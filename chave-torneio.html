<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">

  <meta name="viewport" content="width=device-width, initial-scale=1" >

  <meta name="theme-color" content="#f5f7fa" >

  <meta name="description" content="Chave do torneio - TennisPro" >

  <title>
    Chave do torneio | TennisPro
  </title>

  <link rel="stylesheet" href="css/style.css" >

  <link rel="stylesheet" href="css/admin.css" >

  <link rel="stylesheet" href="css/chave-torneio.css" >

  <!-- Ionicons -->
  <script type="module" src="https://unpkg.com/ionicons@7.4.0/dist/ionicons/ionicons.esm.js" ></script>

  <script nomodule src="https://unpkg.com/ionicons@7.4.0/dist/ionicons/ionicons.js" ></script>
</head>

<body class="bracket-page">

  <main class="bracket-main">

    <!-- ===================================================== -->
    <!-- CABEÇALHO -->
    <!-- ===================================================== -->

    <section class="bracket-header-card">

      <div class="bracket-header-content">

        <span class="bracket-kicker">
          Chave do torneio
        </span>

        <h1 id="bracketTournamentName">
          Carregando...
        </h1>

        <p id="bracketTournamentMeta">
          Carregando dados...
        </p>

        <!-- ===================================================== -->
        <!-- CATEGORIA DA CHAVE -->
        <!-- ===================================================== -->

        <div class="bracket-category-selector">

          <label for="bracketCategorySelect" class="bracket-category-label" >
            Categoria da chave
          </label>

          <select id="bracketCategorySelect" class="bracket-category-select" aria-label="Selecionar categoria para montar a chave" >
            <option value="">
              Carregando categorias...
            </option>
          </select>

          <small class="bracket-category-help">
            Selecione a categoria que deseja montar ou consultar.
          </small>

        </div>

      </div>

      <a href="torneio.html" class="bracket-back-btn" >
        <ion-icon name="arrow-back-outline"></ion-icon>

        <span>
          Voltar
        </span>
      </a>

    </section>

    <!-- ===================================================== -->
    <!-- FILTROS -->
    <!-- ===================================================== -->

    <section class="bracket-toolbar-card">

      <div class="bracket-toggle-group" aria-label="Formato do torneio" >

        <button type="button" class="bracket-toggle is-active" data-format="Simples" >
          Simples
        </button>

        <button type="button" class="bracket-toggle" data-format="Duplas" >
          Duplas
        </button>

      </div>

      <div class="bracket-rounds" aria-label="Fases do torneio" >

        <button type="button" class="bracket-round is-active" data-round="all" >
          Todos
        </button>

        <button type="button" class="bracket-round" data-round="r64" >
          R64
        </button>

        <button type="button" class="bracket-round" data-round="r32" >
          R32
        </button>

        <button type="button" class="bracket-round" data-round="r16" >
          R16
        </button>

        <button type="button" class="bracket-round" data-round="qf" >
          QF
        </button>

        <button type="button" class="bracket-round" data-round="sf" >
          SF
        </button>

        <button type="button" class="bracket-round" data-round="final" >
          F
        </button>

      </div>

    </section>

    <!-- ===================================================== -->
    <!-- AÇÕES DA CHAVE -->
    <!-- ===================================================== -->

    <div class="bracket-save-row bracket-actions">

      <button id="saveBracketBtn" type="button" class="bracket-save-btn" >
        <ion-icon name="save-outline"></ion-icon>

        <span>
          Salvar chave
        </span>
      </button>

      <button id="finishBracketBtn" type="button" class="bracket-finish-btn" >
        <ion-icon name="checkmark-done-outline"></ion-icon>

        <span>
          Finalizar chave
        </span>
      </button>

      <button id="finishTournamentBtn" type="button" class="bracket-finish-tournament-btn" >
        <ion-icon name="flag-outline"></ion-icon>

        <span>
          Finalizar torneio
        </span>
      </button>

      <button id="generateBracketPdfBtn" type="button" class="bracket-pdf-btn" >
        <ion-icon name="document-text-outline"></ion-icon>

        <span>
          Gerar PDF
        </span>
      </button>

      <button id="shareBracketBtn" type="button" class="bracket-share-btn" >
        <ion-icon name="share-social-outline"></ion-icon>

        <span>
          Compartilhar chave
        </span>
      </button>

    </div>

    <!-- ===================================================== -->
    <!-- CHAVE -->
    <!-- ===================================================== -->

    <section id="bracketBoard" class="bracket-board" aria-label="Chave do torneio" ></section>

    <div id="bracketMessage" class="bracket-message" role="status" aria-live="polite" ></div>

  </main>

  <!-- ===================================================== -->
  <!-- MODAL DE POSIÇÃO DO JOGADOR -->
  <!-- ===================================================== -->

  <div id="bracketPlayerModal" class="bracket-modal" hidden aria-hidden="true" >

    <div class="bracket-modal-card" role="dialog" aria-modal="true" aria-labelledby="bracketModalTitle" >

      <div class="bracket-modal-head">

        <div>

          <span class="bracket-kicker">
            Posição da chave
          </span>

          <h2 id="bracketModalTitle">
            Selecionar jogador
          </h2>

        </div>

        <button id="closeBracketModal" type="button" class="bracket-close" aria-label="Fechar" >
          ×
        </button>

      </div>

      <div id="bracketModalPlayers" class="bracket-modal-players" ></div>

    </div>

  </div>

  <!-- ===================================================== -->
  <!-- MODAL DE RESULTADO DA PARTIDA -->
  <!-- ===================================================== -->

  <div id="bracketResultModal" class="bracket-modal" hidden aria-hidden="true" >

    <div class="bracket-modal-card" role="dialog" aria-modal="true" aria-labelledby="bracketResultTitle" >

      <div class="bracket-modal-head">

        <div>

          <span class="bracket-kicker">
            Resultado da partida
          </span>

          <h2 id="bracketResultTitle">
            Informar placar
          </h2>

        </div>

        <button id="closeBracketResultModal" type="button" class="bracket-close" aria-label="Fechar resultado" >
          ×
        </button>

      </div>

      <div class="bracket-result-players">

        <strong id="resultPlayer1Name">
          Jogador 1
        </strong>

        <span>
          ×
        </span>

        <strong id="resultPlayer2Name">
          Jogador 2
        </strong>

      </div>

      <div class="bracket-result-fields">

        <!-- 1º SET -->

        <div id="resultSet1Wrapper" class="bracket-result-set" >

          <strong>
            1º set
          </strong>

          <input id="resultSet1Player1" type="number" min="0" max="7" inputmode="numeric" placeholder="Jogador 1" >

          <input id="resultSet1Player2" type="number" min="0" max="7" inputmode="numeric" placeholder="Jogador 2" >

        </div>

        <!-- 2º SET -->

        <div id="resultSet2Wrapper" class="bracket-result-set" hidden >

          <strong>
            2º set
          </strong>

          <input id="resultSet2Player1" type="number" min="0" max="7" inputmode="numeric" placeholder="Jogador 1" >

          <input id="resultSet2Player2" type="number" min="0" max="7" inputmode="numeric" placeholder="Jogador 2" >

        </div>

        <!-- 3º SET -->

        <div id="resultSet3Wrapper" class="bracket-result-set" hidden >

          <strong>
            3º set
          </strong>

          <input id="resultSet3Player1" type="number" min="0" max="7" inputmode="numeric" placeholder="Jogador 1" >

          <input id="resultSet3Player2" type="number" min="0" max="7" inputmode="numeric" placeholder="Jogador 2" >

        </div>

        <!-- SUPER TIE-BREAK -->

        <div id="resultSuperTieWrapper" class="bracket-result-set" hidden >

          <strong>
            Super tie-break
          </strong>

          <input id="resultSuperTiePlayer1" type="number" min="0" inputmode="numeric" placeholder="Jogador 1" >

          <input id="resultSuperTiePlayer2" type="number" min="0" inputmode="numeric" placeholder="Jogador 2" >

        </div>

      </div>

      <div id="bracketResultMessage" class="bracket-message" role="status" aria-live="polite" ></div>

      <div class="bracket-result-actions">

        <button id="cancelBracketResultBtn" type="button" class="bracket-cancel-result-btn" >
          Cancelar
        </button>

        <button id="saveBracketResultBtn" type="button" class="bracket-save-result-btn" >
          <ion-icon name="save-outline"></ion-icon>

          <span>
            Salvar resultado
          </span>
        </button>

      </div>

    </div>

  </div>

  <!-- ===================================================== -->
  <!-- FIREBASE -->
  <!-- ===================================================== -->

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>

  <script src="js/firebase.js"></script>

  <script src="js/chave-torneio.js?v=20260731-22"></script>

</body>

</html>
